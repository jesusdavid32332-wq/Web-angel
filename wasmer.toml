[package]
name = "jesusdavid32332-wq/web-angel"
version = "1.0.0"
description = "Personalizados Ángel — Tu familia, tu estilo"

[dependencies]
"wasmer/static-web-server" = "^1"

[fs]
public = "."

[[command]]
name = "script"
module = "wasmer/static-web-server:server"
runner = "wasi"

[command.annotations.wasi]
env = ["SERVER_CONFIG_FILE=config.toml"]
cli_args = ["--config-file", "config.toml"]
